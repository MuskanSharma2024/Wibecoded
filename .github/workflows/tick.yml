name: agent-tick
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call tick endpoint
        run: |
          curl -sf -X POST "${{ secrets.TICK_URL }}" \
            -H "x-tick-secret: ${{ secrets.TICK_SECRET }}" \
            || echo "Tick call failed, will retry next scheduled run"
